[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-maps"
version = "0.1.0"
description = "Build evidence-backed prerequisite maps for arXiv papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
knowledge-maps = "knowledge_maps.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_maps"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
